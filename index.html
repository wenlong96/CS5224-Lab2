
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Twitter User Statistics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 50px auto;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
    }
    .user {
      background: #f2f2f2;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>Twitter User Statistics</h1>
  <p>Follower and followee counts calculated using Apache Spark on AWS EMR.</p>

  <input id="userId" placeholder="Enter user ID">
  <button onclick="searchUser()">Search</button>
  <button onclick="showRequired()">Required Users</button>
  <button onclick="browseUsers(0)">Browse All</button>
  <button onclick="browseUsers(1)">Next 50</button>

  <p id="status"></p>
  <div id="results"></div>

  <script>
    const API = "https://8n1rsl73q2.execute-api.ap-southeast-1.amazonaws.com/default/CS5224Lab2ResultsAPI";
    let offset = 0;

    async function getData(params) {
      const response = await fetch(API + "?" + params);
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }
      return data;
    }

    function display(users) {
      const container = document.getElementById("results");
      container.innerHTML = "";

      users.forEach(user => {
        const div = document.createElement("div");
        div.className = "user";
        div.textContent =
          `${user.user_id} has ${user.followers} followers\n` +
          `${user.user_id} has ${user.followees} followees`;
        div.style.whiteSpace = "pre-line";
        container.appendChild(div);
      });
    }

    async function showRequired() {
      try {
        const ids = ["214328887", "107830991"];
        const responses = await Promise.all(
          ids.map(id => getData("user_id=" + id))
        );
        display(responses.flatMap(data => data.results));
        document.getElementById("status").textContent = "";
      } catch (error) {
        document.getElementById("status").textContent = error.message;
      }
    }

    async function searchUser() {
      const id = document.getElementById("userId").value.trim();
      if (!/^\d+$/.test(id)) {
        document.getElementById("status").textContent = "Enter a valid user ID.";
        return;
      }

      try {
        const data = await getData("user_id=" + id);
        display(data.results);
        document.getElementById("status").textContent = "";
      } catch (error) {
        document.getElementById("results").innerHTML = "";
        document.getElementById("status").textContent = error.message;
      }
    }

    async function browseUsers(next) {
      if (next) offset += 50;
      else offset = 0;

      try {
        const data = await getData(`offset=${offset}&limit=50`);
        display(data.results);
        document.getElementById("status").textContent =
          `Showing ${offset + 1}-${offset + data.results.length} of ${data.total} users`;
      } catch (error) {
        document.getElementById("status").textContent = error.message;
      }
    }

    showRequired();
  </script>
</body>
</html>
